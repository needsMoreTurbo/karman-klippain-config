#####################################################################
#   BDPressure E — automatic pressure-advance calibration
#####################################################################
# PandaPi3D BDPressure E strain-gauge sensor at the hotend groove mount, connected to the Pi by
# USB-C. Standalone PA calibration only — this is NOT a probe.
#
# Full context, wiring rationale and hazards: docs/runbooks/bdpressure-pa-sensor.md
#
# Four things a future reader will want to know before editing this file:
#
#   1. THE VENDOR'S [probe] SECTION IS DELIBERATELY OMITTED. Beacon is the only probe on this
#      machine (stepper_z uses probe:z_virtual_endstop, contact_auto_calibrate runs every print).
#      A second [probe] collides. Nothing here needs it — PA_CALIBRATE drives the sensor purely
#      through SET_BDPRESSURE and reads printer["bdpressure bd_pa"].state.
#
#   2. USB, NOT I2C — changed 2026-08-12 after the original I2C plan. I2C structurally cannot
#      deliver the raw signal: the firmware only ever writes the *processed* "R:" result into the
#      I2C register file (pa.c:204), while the raw ADC stream goes exclusively to the UART
#      (main.c, `out_data_mode`). USB also runs the sensor at its designed 5V from VBUS, restores
#      the vendor's diagnostic tooling, and removes the I2C NAK->MCU-shutdown hazard entirely.
#
#   3. `port:` MUST BE EXACTLY `usb`. Startup matches loosely (`"usb" in self.port`) but every
#      runtime method matches exactly (`"usb" == self.port`), so a value like "usb0" would
#      initialise and then silently do nothing.
#
#   4. PA_CALIBRATE DE-ENERGIZES X AND Y and purges ~480 mm3 in one spot. All its G1 X/Y moves
#      are virtual — the toolhead does not move. Use KARMAN_PA_CALIBRATE, never the bare macro.
#####################################################################


[bdpressure bd_pa]
port: usb
# Explicit path rather than `auto`: auto-detect probes every serial port on the system, and this
# Pi also hosts the Beacon and three Klipper MCUs. Note the CH340 exposes no serial number, so
# this by-id path is generic to the chip — if a second CH340 device is ever added, disambiguate
# with a /dev/serial/by-path/... entry instead.
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 38400
thrhold: 4                                     # probe trigger threshold; unused in PA-only mode
# Logs every serial line received to klippy.log (~50k lines per sweep). Set to 1 when a raw ADC
# capture is wanted — that is how physics/captures/ was built — then set it back. Off now: the
# three captures we needed are in the repo and klippy.log had grown past 100 MB.
debug: 0


#####################################################################
#   Vendor macros (patched — see notes on PA_CALIBRATE)
#####################################################################

[gcode_macro PA_RESET]
description: Return the BDPressure sensor to its idle/probe state
gcode:
    M400
    SET_BDPRESSURE NAME=bd_pa COMMAND=RESET_PROBE


[gcode_macro PA_STATE]
description: Report the BDPressure sensor's current state
gcode:
    {% set status = printer["bdpressure bd_pa"].state %}
    { action_respond_info("bd_pa state: %s" % status) }


# Called 50x by PA_CALIBRATE. The G1 X/Y moves here are virtual: X and Y are de-energized at this
# point, so they set timing and feedrate, nothing more.
#
# [KARMAN PATCH — flow-scaled geometry, 2026-08-13]
# The vendor's fixed 20/40/20 mm pattern makes the extrusion event's DURATION inversely
# proportional to flow, and duration is what the firmware analyser cannot tolerate:
#
#     if (low_count > 2 * SAMPLES) return 0;      // 60 samples = 0.68 s at 87 SPS
#
#   flow          slow      fast        whole event        vs the 60-sample cap
#   25 mm3/s      0.94 s    0.18 s      2.06 s = 180 smp   3x over   -> 92% hit rate
#   14.4 mm3/s    1.64 s    0.31 s      3.58 s = 314 smp   5x over   -> 24% hit rate
#
# Scaling every distance by (MAX_VOLUMETRIC / 25) holds the event at ~180 samples for ANY flow,
# so every grid condition sits the same distance from the cap and is genuinely comparable.
# Speeds already scale with flow, so E-per-mm stays 0.046 and the measured flow rates are
# unchanged — only the duration normalises. SCALE=1 reproduces the vendor geometry exactly.
[gcode_macro PA_E]
gcode:
    {% set status = printer["bdpressure bd_pa"].state %}
    {% set i = params.I|int %}
    {% if status == 'START' %}
        {% set pressure_ad = 0 + i * (params.STEP|float) %}
        SET_PRESSURE_ADVANCE ADVANCE={pressure_ad}
        {% set y_step = 38.75 + i * 3.5 %}
        {% set s = params.SCALE|default(1)|float %}
        {% set x0 = 78 %}
        {% set x1 = x0 + 20 * s %}
        {% set x2 = x1 + 40 * s %}
        {% set x3 = x2 + 20 * s %}
        G1 X{x0} Y{y_step} F{params.T_SPEED|int}
        G1 F{params.L_SPEED|int}
        G1 X{x1|round(3)} Y{y_step} E{(0.92643 * s)|round(5)}
        G1 F{params.H_SPEED|int}
        G1 X{x2|round(3)} Y{y_step} E{(1.85285 * s)|round(5)}
        G1 F{params.L_SPEED|int}
        G1 X{x3|round(3)} Y{y_step} E{(0.92643 * s)|round(5)}
        M400
        SET_BDPRESSURE NAME=bd_pa COMMAND=READ VALUE={pressure_ad}
    {% endif %}


# Vendor PA_CALIBRATE with three Karman patches, all marked [PATCH] below:
#   a) ACC_WALL was read from params.ACCEL_TO_DECEL inside the `if params.ACC_WALL` branch, so a
#      passed ACC_WALL was silently discarded and 4000 always used.
#   b) `SET_VELOCITY_LIMIT ... ACCEL_TO_DECEL=` dropped — that parameter no longer exists on this
#      Klipper (v0.13.0-662). Klipper ignores unknown gcode params so it was harmless, but dead.
#   c) The recovery replaced. The vendor did `SET_KINEMATIC_POSITION X=0 Y=0` then `G28 X`/`G28 Y`,
#      which asserts the toolhead is at (0,0) — inside the permanent front-left cutter keep-out —
#      while it is physically ~78 mm away. We clear the homed state instead of lying about it,
#      then home normally, and restore the velocity limits the vendor leaves mangled.
[gcode_macro PA_CALIBRATE]
description: Raw PA sweep. Prefer KARMAN_PA_CALIBRATE — this does not position the toolhead.
gcode:
    {% set NOZZLE_TEMP = params.NOZZLE_TEMP|default(210)|float %}
    {% set ACC_WALL = params.ACC_WALL|default(4000)|float %}                          # [PATCH a]
    {% set SQUARE_CORNER_SPEED = params.SQUARE_CORNER_VELOCITY|default(9)|float %}
    {% set TRAVEL_SPEED = params.TRAVEL_SPEED|default(400)|float * 60 %}
    {% set MAX_VOLUMETRIC = params.MAX_VOLUMETRIC|default(20)|float %}
    {% set HOME_AFTER = params.HOME_AFTER|default(1)|int %}

    # Capture the REAL position now, while Klipper's idea of it is still true. Everything after
    # COMMAND=START is virtual, so this is where the toolhead physically stays for the whole sweep.
    {% set x0 = printer.toolhead.position.x %}
    {% set y0 = printer.toolhead.position.y %}

    # ACC_TO_DECEL_FACTOR is the legacy spelling; MINIMUM_CRUISE_RATIO is what Klipper uses now.
    {% if params.ACC_TO_DECEL_FACTOR is defined %}
        {% set MIN_CRUISE = 1.0 - (params.ACC_TO_DECEL_FACTOR|replace("%", "")|trim|float / 100) %}
    {% else %}
        {% set MIN_CRUISE = params.MINIMUM_CRUISE_RATIO|default(0.5)|float %}
    {% endif %}

    {% set low_speed = 51 * MAX_VOLUMETRIC %}
    {% set high_speed = 537 * MAX_VOLUMETRIC %}
    { action_respond_info("PA_CALIBRATE: temp=%.0f accel=%.0f min_cruise=%.2f low=%.0f high=%.0f"
                          % (NOZZLE_TEMP, ACC_WALL, MIN_CRUISE, low_speed, high_speed)) }

    G90
    G21
    M83
    M109 S{NOZZLE_TEMP}
    G1 E4
    SET_PRESSURE_ADVANCE ADVANCE=0.04
    SET_VELOCITY_LIMIT ACCEL={ACC_WALL} MINIMUM_CRUISE_RATIO={MIN_CRUISE}              # [PATCH b]
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={SQUARE_CORNER_SPEED}

    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=1

    # From here until COMMAND=STOP the module drives the stepper_x/stepper_y enable pins low
    # directly, behind Klipper's back. The gantry is slack and all XY moves below are virtual.
    SET_BDPRESSURE NAME=bd_pa COMMAND=START
    M400
    G4 P1000

    {% set y_step = 38.75 %}
    {% set pressure_step = 0.002 %}

    # [KARMAN PATCH] Flow-scaled geometry — see the PA_E header for why. The warm-up pattern below
    # is scaled identically so it primes under the same conditions the sweep will measure.
    #
    # GEOM_SCALE overrides it. Needed because flow-scaling shortens the slow segments, and the melt
    # has a SLOW relaxation mode with tau ~2.8 s (measured from the post-spike recovery in
    # physics/). A settled plateau needs a segment of a few tau, so any test that reads plateau
    # LEVELS — as opposed to the spike — wants the long vendor pattern even at low flow. At
    # MAX_VOLUMETRIC=5 the scaled segment is 0.94 s (32% settled); GEOM_SCALE=1 makes it 4.71 s (86%).
    {% set SCALE = params.GEOM_SCALE|default(MAX_VOLUMETRIC / 25.0)|float %}
    {% set wx1 = 78 + 20 * SCALE %}
    {% set wx2 = wx1 + 40 * SCALE %}
    {% set wx3 = wx2 + 20 * SCALE %}
    { action_respond_info("PA_CALIBRATE: geometry scale %.3f -> segments %.1f/%.1f/%.1f mm, event ~%.2fs"
                          % (SCALE, 20*SCALE, 40*SCALE, 20*SCALE,
                             2*(20*SCALE)/(low_speed/60) + (40*SCALE)/(high_speed/60))) }

    G1 F{high_speed}
    G1 X78 Y{y_step} E9.92204
    M400
    G4 P4000
    G1 F{low_speed}
    G1 X{wx1|round(3)} Y{y_step} E{(0.92643 * SCALE)|round(5)}
    G1 X{wx2|round(3)} Y{y_step} E{(1.85285 * SCALE)|round(5)}
    G1 X{wx3|round(3)} Y{y_step} E{(0.92643 * SCALE)|round(5)}
    G1 X78 Y{y_step} F{TRAVEL_SPEED}
    M400

    {% for i in range(50) %}
        PA_E STEP={pressure_step} T_SPEED={TRAVEL_SPEED} H_SPEED={high_speed} L_SPEED={low_speed} I={i} SCALE={SCALE|round(5)}
    {% endfor %}
    M400

    SET_BDPRESSURE NAME=bd_pa COMMAND=STOP
    G4 P500
    SET_BDPRESSURE NAME=bd_pa COMMAND=RESET_PROBE
    G4 P500

    # [PATCH c] Recovery. X/Y were de-energized, so Klipper's idea of where they are is fiction:
    # it believes it traced the sweep pattern, when the toolhead never left (x0, y0).
    #
    # DEFAULT (HOME_AFTER=1) re-homes, which is the safe behaviour: it re-establishes X/Y from the
    # endstops and cannot be fooled by physical drift.
    #
    # HOME_AFTER=0 skips it and restores the captured position instead. That is correct *by
    # construction*, not by assumption — with the motors off, every G1 X/Y above was virtual, so
    # the toolhead never left (x0, y0). It saves a full homing cycle per run, which is worth
    # opting into when running a calibration grid of many back-to-back sweeps.
    #
    # What HOME_AFTER=0 cannot account for is physical drift: a de-energized CoreXY gantry is held
    # only by belt friction, so a knock could move it without Klipper knowing — and the restore
    # would then assert a position that is wrong. Home at the start of a session, after any bump,
    # and periodically through a long batch.
    {% if HOME_AFTER %}
        SET_KINEMATIC_POSITION CLEAR=XY
        G28 X Y
    {% else %}
        SET_KINEMATIC_POSITION X={x0} Y={y0}
    {% endif %}

    # Klippain's _HOME_XY post-hook restores accel to whatever it was at homing time — i.e. our
    # ACC_WALL. Put the machine back to its configured limits explicitly.
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel} SQUARE_CORNER_VELOCITY={printer.configfile.settings.printer.square_corner_velocity} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio}

    # [KARMAN PATCH] Restore pressure advance. PA_E sets it on every step and the sweep ends on
    # the LAST value it tried, so without this the machine is left at the top of the swept range —
    # roughly 0.10 against a configured 0.035. The module no longer applies its own answer either
    # (apply_result defaults off), so nothing else puts this back. Restoring the configured value
    # makes the sweep a measurement with no side effect on the next print.
    SET_PRESSURE_ADVANCE ADVANCE={printer.configfile.settings.extruder.pressure_advance}
    { action_respond_info("PA_CALIBRATE: pressure advance restored to %.4f (the configured value)"
                          % printer.configfile.settings.extruder.pressure_advance) }


#####################################################################
#   Karman wrapper — this is the one to call
#####################################################################
# PA_CALIBRATE cannot move the toolhead (X/Y are off), so the entire ~480 mm3 purge lands
# wherever the toolhead happens to be. This wrapper puts it somewhere deliberate first, guards
# the preconditions, soaks and primes, and warns about the hot-nozzle/Beacon-contact interaction
# afterwards.
#
# ⚠️ THE SOAK IS NOT OPTIONAL — see docs/decisions.md 2026-08-12. M109 waits only for the NOZZLE;
# the groove-mount strain gauge keeps heating for minutes afterwards, and a sweep run during that
# drift reads high. Measured: a cold-start run gave 0.040 where four soaked runs gave 0.030-0.034.
[gcode_macro KARMAN_PA_CALIBRATE]
description: Position, soak, prime, run a PA sweep, and recover safely. Standalone use only.
# Front-centre, deliberately: clear of every keep-out (the front-left cutter zone is x<10/y<17),
# and at the front edge so the blob can be watched and cleared without reaching over the bed.
# Z=80 keeps the nozzle well clear of the accumulating blob across repeated runs.
# Run with the bed UNHEATED — ABS will not bond to a cold plate and the blob lifts off.
variable_purge_x: 175
variable_purge_y: 40
variable_purge_z: 80
# Soak seconds after M109 is satisfied. "cold" applies when the nozzle starts more than 5 C below
# target; "hot" is the short settle for back-to-back runs. soak_cold is a considered starting
# value, not a measured optimum — runs 4-7 of the repeat study were 1-3 min apart and were clean.
variable_soak_cold: 240
variable_soak_hot: 30
# Prime after the soak: a long soak oozes, and the UHF melt zone holds ~33 mm
# (toolhead_residual_filament — measured 2026-08-12, see docs/decisions.md), so the sweep would
# otherwise start on a partly empty nozzle. Sized to fully displace that melt zone.
variable_prime_mm: 40
gcode:
    {% set purge_x = params.PURGE_X|default(printer["gcode_macro KARMAN_PA_CALIBRATE"].purge_x)|float %}
    {% set purge_y = params.PURGE_Y|default(printer["gcode_macro KARMAN_PA_CALIBRATE"].purge_y)|float %}
    {% set purge_z = params.PURGE_Z|default(printer["gcode_macro KARMAN_PA_CALIBRATE"].purge_z)|float %}
    {% set nozzle_temp = params.NOZZLE_TEMP|default(260)|float %}
    {% set travel_speed = printer["gcode_macro _USER_VARIABLES"].travel_speed|default(300)|float * 60 %}
    {% set prime_mm = params.PRIME_MM|default(printer["gcode_macro KARMAN_PA_CALIBRATE"].prime_mm)|float %}

    # Soak length depends on how far from target we are starting.
    {% set t_start = printer.extruder.temperature|float %}
    {% if t_start >= (nozzle_temp - 5) %}
        {% set soak_default = printer["gcode_macro KARMAN_PA_CALIBRATE"].soak_hot %}
    {% else %}
        {% set soak_default = printer["gcode_macro KARMAN_PA_CALIBRATE"].soak_cold %}
    {% endif %}
    {% set soak = params.SOAK|default(soak_default)|int %}

    # Guard: never mid-print. print_stats.state, not mmu.print_state — see docs/decisions.md.
    {% if printer.print_stats.state == "printing" %}
        { action_raise_error("KARMAN_PA_CALIBRATE: refusing to run during a print.") }
    {% endif %}

    # Guard: filament must be at the nozzle or the sweep measures nothing.
    {% if not printer["filament_switch_sensor toolhead_sensor"].filament_detected %}
        { action_raise_error("KARMAN_PA_CALIBRATE: no filament at the toolhead sensor. Load with SWAP TOOL=n first.") }
    {% endif %}

    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # Log the starting temperature: it is what tells a later analysis whether a run was thermally
    # settled, and reconstructing it from klippy.log Stats afterwards is painful.
    { action_respond_info("KARMAN_PA_CALIBRATE: start nozzle %.1fC -> target %.0fC, soak %ds, prime %.0fmm, purging ~480 mm3 at X%.1f Y%.1f Z%.1f"
                          % (t_start, nozzle_temp, soak, prime_mm, purge_x, purge_y, purge_z)) }

    M107                                        # part fan off — vibration perturbs the strain gauge
    G90
    G1 Z{purge_z} F1500
    G1 X{purge_x} Y{purge_y} F{travel_speed}
    M400

    # Heat and soak IN POSITION, so everything that oozes lands on the purge target.
    M109 S{nozzle_temp}
    {% if soak > 0 %}
        { action_respond_info("KARMAN_PA_CALIBRATE: soaking %ds at %.0fC (console will look idle)" % (soak, nozzle_temp)) }
        G4 P{soak * 1000}
    {% endif %}

    # Prime: replace what oozed away during the soak so the sweep starts on a full melt zone.
    {% if prime_mm > 0 %}
        M83
        G1 E{prime_mm} F300
        M400
        G4 P2000                                # let the melt-zone pressure settle before measuring
    {% endif %}

    PA_CALIBRATE NOZZLE_TEMP={nozzle_temp} MAX_VOLUMETRIC={params.MAX_VOLUMETRIC|default(25)} ACC_WALL={params.ACC_WALL|default(5000)} TRAVEL_SPEED={params.TRAVEL_SPEED|default(300)} MINIMUM_CRUISE_RATIO={params.MINIMUM_CRUISE_RATIO|default(0.5)} HOME_AFTER={params.HOME_AFTER|default(1)} GEOM_SCALE={params.GEOM_SCALE|default(params.MAX_VOLUMETRIC|default(25)|float / 25.0)}

    { action_respond_info("KARMAN_PA_CALIBRATE: done. Read the PA value from the bd_pa lines above.") }
    { action_respond_info("Nozzle is still at %.0fC. Beacon contact homing/calibration refuses above 180C — let it cool before any G28 Z, QGL or contact_auto_calibrate." % nozzle_temp) }
