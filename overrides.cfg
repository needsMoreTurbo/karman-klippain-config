#-------------------------#
#   Part Fan Overrides    #
#-------------------------#

## The following are changes required for the unique wiring of the honeybadger 3 wire part fan, where 
## the 3rd wire is a PWM signal and not a tachometer signal.
[fan]
pin: !toolhead:PART_FAN
cycle_time: 0.00004
hardware_pwm: False
kick_start_time: 0.5
off_below: 0.14

#-------------------------#
#   Caselight Overrides   #
#-------------------------#

[output_pin caselight]
cycle_time: 0.00025 ## Setting to high frequency PWM to avoid flickering on the caselight
value: 100
shutdown_value: 0

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_670FCCD84E5737374D202020FF061406-if00
x_offset: 0
y_offset: 18
mesh_main_direction: x
mesh_runs: 2
home_xy_position: 175, 175
# contact_max_hotend_temperature: 275

[extruder]
sensor_type: PT1000
rotation_distance: 22.905740611
max_temp: 350
pressure_advance: 0.035
min_extrude_temp: 170

[heater_bed]
sensor_type: ATC Semitec 104NT-4-R025H42G
max_power: 0.8
sensor_pin: PA2

[stepper_x]
dir_pin: !X_DIR

[stepper_y]
dir_pin: !Y_DIR

[stepper_z]
dir_pin: !Z_DIR

[stepper_z2]
dir_pin: !Z2_DIR

[controller_fan controller_fan]
fan_speed: 0.6

[stepper_x]
position_max: 351
position_endstop: 351
# X endstop relocated to the Nitehawk HV probe port (PC15), wired NC. NOTE: position_endstop
# above still reflects the OLD switch — it must be recalibrated for the new location before
# trusting a homed X. Polarity (^ / !) TBD via QUERY_ENDSTOPS.
endstop_pin: ^toolhead:PROBE_INPUT

[stepper_y]
position_max: 359
position_endstop: 359

# ------- BTT SFS v2 (Smart Filament Sensor) -------
# Both halves are PASSIVE (pause_on_runout: False, no runout_gcode) so they never affect
# printing — we only want their live state visible via QUERY_FILAMENT_SENSOR. Polarity is
# provisional; set after observing readings.
#
# Runout half is observation-only on purpose (redundant with the HH 'extruder' sensor).
# The motion half is the useful one and will later be gated by HH via _MMU_ACTION_CHANGED.
# DISABLED 2026-07-13 — BTT SFS v2 physically removed (its wheel drag was corrupting the
# sync-feedback signal). Both halves are gone: runout (PC0, below) and motion/encoder (PC1,
# the [mmu_encoder] in mmu_hardware.cfg). PC0 + PC1 are now free. Runout/load verification is
# covered by the HH pre-gate / gate / post-gear / extruder / toolhead sensors. Re-enable if the
# SFS is reinstalled (ideally upstream of the sync-feedback sensor).
#[filament_switch_sensor sfs_runout]
#switch_pin: ^RUNOUT_SENSOR        # PC0
#pause_on_runout: False
#runout_gcode:
#insert_gcode:

# ------- Bed Fans -------
# Bed fan control is a self-contained, always-on state machine (see docs/bed_fans_control.md
# and bed_fans.cfg). It runs its own _BED_FAN_TICK loop and needs no START_PRINT hooks, so the
# old "bed_fans_init" / "bed_fans_monitor" actions have been removed from the sequence below.
[include bed_fans.cfg]

# ------- Nozzle thermal expansion compensation -------
# Beacon-contact nozzle growth compensation (see thermal_expansion.cfg and
# docs/thermal_expansion.md). Wired into START_PRINT/END_PRINT via the
# "nozzle_expansion" action registered in _USER_VARIABLES below.
[include thermal_expansion.cfg]

# ------- MMU park move: side-approach for gantry-mounted rest/brush -------
# The nozzle rest (x=45), brush (x=53-88) and blobifier assembly all live at y_max. They must be
# approached from the SIDE (slide in X at y_max), never head-on in +Y at their x position.
# Clear +Y approach lanes: 15 < x < 40 (between depressor/tray and rest), or x > 95.
# Hooked in via variable_user_park_move_macro in mmu_macro_vars.cfg. HH calls:
#   _KARMAN_PARK_MOVE X=.. Y=.. F=..            (move to park position)
#   _KARMAN_PARK_MOVE RESTORE=1 X=.. Y=.. F=..  (leave park, restore to coords)
[gcode_macro _KARMAN_PARK_MOVE]
description: Park move that enters/leaves the y_max feature row through a clear lane
#
# ⚠️ -999 SENTINEL: HH calls this macro UNCONDITIONALLY when user_park_move_macro is set
# (mmu_sequence.cfg _MMU_PARK) — its own "x != -999" filtering only guards the DEFAULT path.
# So handling the sentinel is this macro's job. -999 means "no move on that axis"; emitting
# G1 X-999 throws "Move out of range" and aborts the park (hit on every toolchange, because
# park_toolchange is -999,-999 while park_pause/park_complete carry real coordinates).
gcode:
    {% set x = params.X|default(-999)|float %}
    {% set y = params.Y|default(-999)|float %}
    {% set f = params.F|default(12000)|float %}
    {% set restore = params.RESTORE|default(0)|int %}
    {% set lane_x = 30 %}       # middle of the 15<x<40 clear lane
    {% set ymax_zone = 350 %}   # y beyond which the gantry-mounted features live
    {% set pos = printer.gcode_move.gcode_position %}
    {% set in_lane = (15 < pos.x < 40) or (pos.x > 95) %}

    {% if x == -999 and y == -999 %}
        # No XY move requested (z-hop, if any, was already done by _MMU_PARK). Nothing to do.
    {% elif not restore and (pos.x - x)|abs < 0.5 and (pos.y - y)|abs < 0.5 %}
        # Already at target — skip (avoids a lane shuffle when HH and Klippain both park here)
    {% else %}
        G90
        {% if x != -999 and y == -999 %}
            G1 X{x} F{f}                    # X-only move (a slide; safe within the feature row)
        {% elif x == -999 and y != -999 %}
            {% if y >= ymax_zone and not in_lane %}
                G1 X{lane_x} F{f}           # never enter the feature row outside a clear lane
            {% endif %}
            G1 Y{y} F{f}
        {% elif restore %}
            {% if pos.y >= ymax_zone %}
                G1 X{lane_x} F{f}           # slide sideways out of the feature row first
            {% endif %}
            G1 X{x} Y{y} F{f}
        {% else %}
            {% if y >= ymax_zone %}
                G1 X{lane_x} F{f}           # get into the clear lane at current y
                G1 Y{y} F{f}                # enter the feature row through the lane
                G1 X{x} F{f}                # slide sideways to the target (rest/brush)
            {% else %}
                G1 X{x} Y{y} F{f}
            {% endif %}
        {% endif %}
    {% endif %}

# ------- PARK override: all Klippain parking goes to the nozzle rest -------
# Klippain's stock PARK does a direct G1 to park_position_xy, which (a) fought Happy Hare's
# pause parking (double-park: HH parked on the rest, then PARK yanked to 343,352) and (b) would
# approach the gantry-mounted rest head-on. This override keeps PARK's interface (X/Y/Z_HOP/E)
# but routes the XY through _KARMAN_PARK_MOVE (side approach via the clear lanes). Callers:
# PAUSE, CANCEL_PRINT, END_PRINT, _KLIPPAIN_MMU_INIT — all now converge on the rest.
# The rest is gantry-mounted, so any Z works.
[gcode_macro PARK]
description: Park on the nozzle rest via side approach (overrides Klippain PARK)
gcode:
    {% set Px, Py = printer["gcode_macro _USER_VARIABLES"].park_position_xy|map('float') %}
    {% set Px = params.X|default(Px)|float %}
    {% set Py = params.Y|default(Py)|float %}
    {% set park_lift_z = printer["gcode_macro _USER_VARIABLES"].park_lift_z %}
    {% set Z_HOP = params.Z_HOP|default(park_lift_z)|float %}
    {% set St = printer["gcode_macro _USER_VARIABLES"].travel_speed * 60 %}
    {% set Sz = printer["gcode_macro _USER_VARIABLES"].z_drop_speed * 60 %}

    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set gcode_z = printer.gcode_move.gcode_position.z|float %}
    {% set z_safe = [[gcode_z + Z_HOP, gcode_z + max_z - act_z - 1.0]|min, gcode_z]|max %}

    {% if printer.toolhead.homed_axes != "xyz" %}
        {action_raise_error("Cannot park the toolhead because axis are not homed!")}
    {% endif %}

    SAVE_GCODE_STATE NAME=PARK
    {% if printer.extruder.can_extrude %}
        {% set E = params.E|default(2)|float|abs %}
        {% if E > 0 %}
            M83
            G1 E-{E} F2100
        {% endif %}
    {% endif %}
    G90
    G1 Z{z_safe} F{Sz}
    _KARMAN_PARK_MOVE X={Px} Y={Py} F={St}
    RESTORE_GCODE_STATE NAME=PARK

# ------- RESUME override: leave the nozzle rest sideways before restoring -------
# Klippain's RESUME restores the pre-pause position with a direct MOVE=1 — from the rest cup
# that's a head-on exit. This copy inserts a lane slide-out first when parked in the y_max row.
[gcode_macro RESUME]
rename_existing: BASE_RESUME
description: Resume with a side exit from the nozzle rest (overrides Klippain RESUME)
variable_extruder_target_temp: 0
gcode:
    {% set St = printer["gcode_macro _USER_VARIABLES"].travel_speed %}
    {% set light_enabled = printer["gcode_macro _USER_VARIABLES"].light_enabled %}
    {% set light_intensity_printing = printer["gcode_macro _USER_VARIABLES"].light_intensity_printing %}
    {% set klippain_mmu_enabled = printer["gcode_macro _USER_VARIABLES"].klippain_mmu_enabled %}
    {% set idle_timeout_on_pause = printer["gcode_macro _USER_VARIABLES"].idle_timeout_on_pause|default(0)|int %}
    {% set turn_off_extruder = printer["gcode_macro _USER_VARIABLES"].turn_off_extruder_on_pause %}

    {% if not printer.pause_resume.is_paused %}
        RESPOND MSG="Print is not paused. Resume ignored"
    {% else %}
        {% if printer.gcode_move.gcode_position.y >= 350 %}
            G90
            G1 X30 F{St * 60}      ; side exit from the rest/feature row through the clear lane
        {% endif %}
        {% if klippain_mmu_enabled %}
            {% if printer.mmu.enabled and printer.mmu.is_locked %}
                RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=0
            {% else %}
                RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED={St}
            {% endif %}
        {% else %}
            RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED={St}
        {% endif %}

        {% if light_enabled %}
            LIGHT_ON S={light_intensity_printing}
        {% endif %}

        {% if idle_timeout_on_pause > 0 %}
            SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
        {% endif %}

        {% if turn_off_extruder and extruder_target_temp > 0 %}
            M109 S{extruder_target_temp|int}
        {% endif %}

        BASE_RESUME
    {% endif %}

# ------- Idle timeout: come to rest ON the nozzle rest -------
# Klippain's stock idle_timeout gcode turns off heaters and drops the steppers wherever the
# toolhead happens to sit. Parking on the rest first makes "on the rest" the machine's true
# idle state, so a swap started from idle already begins (and therefore ends) at the rest.
# Safe with M84: the rest is gantry mounted, so if the gantry sags with Z steppers released
# the nozzle and cup move together - no jamming. Z lift below is only bed/print clearance
# for the XY travel; seating on the rest is the X slide alone.
[idle_timeout]
timeout: 1800
gcode:
    RESPOND MSG="Idle timeout reached"
    TURN_OFF_HEATERS
    {% if "xyz" in printer.toolhead.homed_axes %}
        G90
        G1 Z{[printer.gcode_move.gcode_position.z, 15]|max} F900
        _KARMAN_PARK_MOVE X=45 Y=359 F=12000
    {% endif %}
    M84
    {% if printer["gcode_macro _USER_VARIABLES"].light_enabled %}
        LIGHT_OFF
    {% endif %}
    {% if printer["gcode_macro _USER_VARIABLES"].status_leds_control_enabled|default(False) %}
        STATUS_LEDS COLOR="OFF"
    {% endif %}

# ------- Nozzle LEDs white while purging -------
# The purge happens while Klippain's LED state is "heating", whose nozzle colour is red — which
# makes it impossible to judge the colour change in the blob. HH calls _MMU_ACTION_CHANGED with
# ACTION/OLD_ACTION on every action transition; "Purging" is one of them. Hooked via
# variable_user_action_changed_extension in mmu_macro_vars.cfg.
[gcode_macro _KARMAN_MMU_ACTION_CHANGED]
description: Nozzle LEDs to white during purge so the colour change is visible
gcode:
    {% set action = params.ACTION|default('')|string %}
    {% set old_action = params.OLD_ACTION|default('')|string %}
    {% if printer["gcode_macro _USER_VARIABLES"].status_leds_control_enabled|default(False) %}
        {% if action == "Purging" %}
            SET_NOZZLE_LEDS_ON
        {% elif old_action == "Purging" %}
            {% if printer.print_stats.state == "printing" %}
                STATUS_LEDS COLOR="PRINTING"
            {% else %}
                STATUS_LEDS COLOR="READY"
            {% endif %}
        {% endif %}
    {% endif %}

# ------- Standalone (not printing) MMU op cleanup -------
# Turns the hotend off after a bench swap/eject so it doesn't sit at 260C oozing.
# NOTE: this macro deliberately does NOT park. Happy Hare saves the toolhead position at the
# START of the command (mmu.py:6892 _save_toolhead_position_and_park) and restores it as the
# final step (mmu.py:3281), so ANY park done from an extension hook is immediately undone.
# Controlling where a swap ENDS is only possible from outside the Tn command — see SWAP below.
# IN-PRINT GUARD - read before changing:
# Klipper's print_stats.state is the PRIMARY guard because it reads "printing" for the whole
# gcode file, START_PRINT included. That matters: Klippain's _KLIPPAIN_MMU_LOAD_INITIAL_TOOL
# runs MMU_CHANGE_TOOL STANDALONE=1 during START_PRINT, which fires this hook while HH's own
# print_state is still "initialized" (not "printing"). Guarding on HH state alone would shut
# the hotend off mid-START_PRINT on every print. HH state is kept only as a second layer.
[gcode_macro _KARMAN_STANDALONE_FINISH]
description: Turn the hotend off after a standalone (non-print) MMU operation
gcode:
    {% if printer.print_stats.state not in ["printing", "paused"]
          and printer.mmu.print_state in ["ready", "idle", "complete", "standby"] %}
        M104 S0
        RESPOND MSG="Standalone MMU op complete - hotend off"
    {% endif %}

# ------- SWAP: the bench filament-change command -------
# Parks on the nozzle rest FIRST, so the ~2min heat-up oozes into the RTV cup instead of
# draining the melt zone in mid-air (which left the first blobifier purge extruding nothing).
# Because HH restores to the position saved at command start, parking first ALSO means the
# swap ends back on the rest. Use this instead of a bare Tn for bench swaps.
[gcode_macro SWAP]
description: Standalone tool swap: park on rest, change tool, hotend off
gcode:
    {% if params.TOOL is not defined %}
        RESPOND TYPE=error MSG="Usage: SWAP TOOL=n"
    {% else %}
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28
        {% endif %}
        G90
        # Z lift is purely bed/print clearance for the XY travel below - the rest is gantry
        # mounted, so its Z tracks the toolhead and only the X slide seats/unseats the nozzle.
        G1 Z{[printer.gcode_move.gcode_position.z, 15]|max} F900
        _KARMAN_PARK_MOVE X=45 Y=359 F=12000
        T{params.TOOL|int}
        M104 S0
        RESPOND MSG="Swap complete - parked on rest, hotend off"
    {% endif %}

# Standalone blobifier test: purge + wipe, then park on the nozzle rest (side approach).
# In real toolchanges BLOBIFIER must NOT end at the rest — HH's restore diagonal would drag
# the nozzle forward out of the cup. Parking on the rest is owned by park_pause/park_complete.
[gcode_macro BLOBIFIER_TEST]
description: BLOBIFIER + park on the nozzle rest (bench testing only)
gcode:
    BLOBIFIER {rawparams}
    _KARMAN_PARK_MOVE X=45 Y=359 F=12000

[gcode_shell_command git_push]
command: ~/printer_data/config/git_sync.sh push
timeout: 60.0
verbose: True

[gcode_shell_command git_pull]
command: ~/printer_data/config/git_sync.sh pull
timeout: 60.0
verbose: True

[gcode_macro GIT_PUSH]
description: Commits and pushes current config to GitHub
gcode:
    RUN_SHELL_COMMAND CMD=git_push

[gcode_macro GIT_PULL]
description: Pulls config from GitHub (the script restarts firmware only if it changed)
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] %}
        RESPOND TYPE=error MSG="GIT_PULL blocked while a print is active"
    {% else %}
        RUN_SHELL_COMMAND CMD=git_pull
    {% endif %}

